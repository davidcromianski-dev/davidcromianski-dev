name: Update profile card

on:
  schedule:
    - cron: "17 6 * * *" # every day at 03:17 (America/Sao_Paulo)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - profile.json
      - assets/**
      - scripts/update.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render card
        env:
          # A personal token lets the script see private repos and org commits.
          # Without it the workflow token is used and only public data is counted.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TZ: America/Sao_Paulo
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache/
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: update profile card"
            git push
          fi
